name: Run quality checks

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]

jobs:
  quality_checks:
    name: Run Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create google-services.json file
        if: ${{ inputs.create_google_json == true }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Inject API secrets
        run: |
          echo "OPEN_WEATHER_API_KEY=${{ secrets.OPEN_WEATHER_API_KEY }}" >> local.properties
          echo "OPEN_WEATHER_BASE_URL=${{ secrets.OPEN_WEATHER_BASE_URL }}" >> local.properties
          echo "CITY_API=${{ secrets.CITY_API }}" >> local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run Lint checks
        run: ./gradlew ktlintCheck